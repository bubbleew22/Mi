<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Snow_owl — Engineering Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #0a0e1a; color: #e2e8f0; padding: 12px; padding-bottom: 80px; }
  header { text-align: center; padding: 18px 0; border-bottom: 2px solid #1e293b; margin-bottom: 16px; }
  header h1 { color: #38bdf8; font-size: 28px; letter-spacing: 2px; }
  header h1 span { color: #94a3b8; font-size: 20px; }
  header p { color: #64748b; font-size: 11px; margin-top: 4px; letter-spacing: 1px; }
  .tabs { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 16px; padding-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 16px; background: #111827; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid #1e293b; color: #94a3b8; }
  .tab.active { background: #38bdf8; color: #0a0e1a; border-color: #38bdf8; font-weight: bold; }
  .card { background: #111827; border-radius: 12px; padding: 16px; margin-bottom: 14px; border-left: 4px solid #38bdf8; display: none; }
  .card.show { display: block; }
  .card h2 { color: #38bdf8; font-size: 16px; margin-bottom: 12px; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: #94a3b8; }
  input, select { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #1e293b; background: #0a0e1a; color: #e2e8f0; font-size: 16px; outline: none; }
  button { width: 100%; padding: 13px; margin-top: 14px; background: #38bdf8; color: #0a0e1a; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .result { margin-top: 12px; padding: 14px; background: #0a0e1a; border-radius: 8px; color: #4ade80; font-size: 19px; font-weight: bold; text-align: center; border: 1px dashed #1e293b; min-height: 20px; }
  .result.small { font-size: 14px; text-align: left; line-height: 1.6; }
  .footer { text-align: center; color: #475569; font-size: 11px; margin-top: 30px; padding: 20px 0; line-height: 1.8; }
</style>
</head>
<body>

<header>
  <h1>🦉 SNOW<span>_OWL</span></h1>
  <p>ELECTRICAL • INSTRUMENTATION • HYDRAULIC</p>
</header>

<div class="tabs">
  <div class="tab active" onclick="filterTab('all', this)">All</div>
  <div class="tab" onclick="filterTab('electrical', this)">Electrical</div>
  <div class="tab" onclick="filterTab('instrument', this)">Instrument</div>
 <div class="tab" onclick="filterTab('utilities', this)">Utilities</div>
</div>

<div id="cards">

<div class="card show" data-cat="electrical" data-name="ohms law">
  <h2>Ohm's Law (V = I × R)</h2>
  <label>Current (A)</label>
  <input type="number" id="ohmI" placeholder="0">
  <label>Resistance (Ω)</label>
  <input type="number" id="ohmR" placeholder="0">
  <button onclick="calcOhm()">Calculate Voltage</button>
  <div class="result" id="ohmResult">—</div>
</div>

<div class="card show" data-cat="electrical" data-name="power">
  <h2>Power (P = V × I × PF)</h2>
  <label>Voltage (V)</label>
  <input type="number" id="pV" placeholder="0">
  <label>Current (A)</label>
  <input type="number" id="pI" placeholder="0">
  <label>Power Factor</label>
  <input type="number" id="pPF" placeholder="1" value="1">
  <button onclick="calcPower()">Calculate Power</button>
  <div class="result" id="pResult">—</div>
</div>

<div class="card show" data-cat="instrument" data-name="4-20ma">
  <h2>4-20mA Scaling</h2>
  <label>mA Reading</label>
  <input type="number" id="mA" placeholder="4-20">
  <label>LRV</label>
  <input type="number" id="lrv" placeholder="0">
  <label>URV</label>
  <input type="number" id="urv" placeholder="100">
  <button onclick="calcMA()">Calculate PV</button>
  <div class="result" id="maResult">—</div>
 <!-- STOPWATCH -->
<div class="card show" data-cat="utilities" data-name="stopwatch timer">
  <h2>⏱️ Stopwatch</h2>
  <div class="result" id="swDisplay" style="font-size:30px; font-family:monospace;">00:00:00</div>
  <button onclick="swStart()" style="background:#4ade80;">▶ Start</button>
  <button onclick="swStop()" style="background:#fbbf24;">⏸ Stop</button>
  <button onclick="swReset()" style="background:#ef4444;">🔄 Reset</button>
</div>

<!-- TIMER -->
<div class="card show" data-cat="utilities" data-name="timer countdown">
  <h2>⏲️ Timer</h2>
  <label>Minutes</label>
  <input type="number" id="timerMin" value="1">
  <label>Seconds</label>
  <input type="number" id="timerSec" value="0">
  <div class="result" id="timerDisplay" style="font-size:30px; font-family:monospace;">01:00</div>
  <button onclick="timerStart()" style="background:#4ade80;">▶ Start</button>
  <button onclick="timerReset()" style="background:#ef4444;">🔄 Reset</button>
</div>

<!-- ALARM -->
<div class="card show" data-cat="utilities" data-name="alarm clock">
  <h2>🔔 Alarm</h2>
  <label>Time (HH:MM)</label>
  <input type="time" id="alarmTime" value="12:00">
  <button onclick="alarmSet()">Set Alarm</button>
  <div class="result" id="alarmResult">Not set</div>
</div>
</div>

</div>

<div class="footer">
  🦉 Snow_owl v2.0<br>
  Personal Use • Offline • Ad-Free
</div>

<script>
function filterTab(cat, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.card').forEach(c => {
    if (cat === 'all' || c.dataset.cat === cat) c.classList.add('show');
    else c.classList.remove('show');
  });
}
function show(id, val) { document.getElementById(id).textContent = val; }
function gv(id) { return parseFloat(document.getElementById(id).value) || 0; }
function calcOhm() { show('ohmResult', (gv('ohmI') * gv('ohmR')).toFixed(3) + ' V'); }
function calcPower() {
  const p = gv('pV') * gv('pI') * (gv('pPF') || 1);
  show('pResult', p.toFixed(2) + ' W');
}
function calcMA() {
  show('maResult', (gv('lrv') + ((gv('mA') - 4) / 16) * (gv('urv') - gv('lrv'))).toFixed(3));
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
 // STOPWATCH
let swTime = 0, swRunning = false, swInt;
function swStart() {
  if (swRunning) return;
  swRunning = true;
  const start = Date.now() - swTime;
  swInt = setInterval(() => {
    swTime = Date.now() - start;
    document.getElementById('swDisplay').textContent = formatSW(swTime);
  }, 50);
}
function swStop() { swRunning = false; clearInterval(swInt); }
function swReset() { swRunning = false; clearInterval(swInt); swTime = 0; document.getElementById('swDisplay').textContent = '00:00:00'; }
function formatSW(ms) {
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// TIMER
let timerLeft = 60000, timerRunning = false, timerInt;
function timerStart() {
  if (timerRunning) return;
  const m = parseInt(document.getElementById('timerMin').value) || 0;
  const s = parseInt(document.getElementById('timerSec').value) || 0;
  timerLeft = (m * 60 + s) * 1000;
  timerRunning = true;
  const end = Date.now() + timerLeft;
  timerInt = setInterval(() => {
    timerLeft = end - Date.now();
    if (timerLeft <= 0) {
      clearInterval(timerInt);
      timerRunning = false;
      document.getElementById('timerDisplay').textContent = '00:00';
      playBeep();
      return;
    }
    const m2 = Math.floor(timerLeft/60000), s2 = Math.floor((timerLeft%60000)/1000);
    document.getElementById('timerDisplay').textContent = String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
  }, 200);
}
function timerReset() { timerRunning = false; clearInterval(timerInt); document.getElementById('timerDisplay').textContent = '01:00'; }

// ALARM
let alarmSet_ = null, alarmInt;
function alarmSet() {
  const t = document.getElementById('alarmTime').value;
  alarmSet_ = { time: t, fired: false };
  document.getElementById('alarmResult').textContent = '✅ Set for ' + t;
  if (alarmInt) clearInterval(alarmInt);
  alarmInt = setInterval(() => {
    if (!alarmSet_ || alarmSet_.fired) return;
    const now = new Date();
    const curr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    if (curr === alarmSet_.time) {
      alarmSet_.fired = true;
      document.getElementById('alarmResult').textContent = '🔔 ALARM!';
      playBeep(); setTimeout(playBeep, 500); setTimeout(playBeep, 1000);
    }
  }, 1000);
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 200);
  } catch(e) {}
}
</script>

</body>
</html>
